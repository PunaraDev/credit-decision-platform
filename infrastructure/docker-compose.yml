# docker compose --env-file .env -f infrastructure/docker-compose.yml up --build -d
name: credit-platform

x-django: &django
  restart: unless-stopped
  depends_on: { postgres: { condition: service_healthy } }
  environment: &env
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-credit}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    DECISION_SERVICE_URL: http://decision:8002
    INTEGRATION_SERVICE_URL: http://integration:8003

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credit}"], interval: 5s, timeout: 3s, retries: 15 }

  identity:
    <<: *django
    build: { context: ../backend, dockerfile: services/identity-service/Dockerfile }
    environment:
      <<: *env
      POSTGRES_DB: identity-service
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-0}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_users && gunicorn config.wsgi:application -b 0.0.0.0:8004 --workers 3 --timeout 60 --access-logfile -"

  workflow:
    <<: *django
    build: { context: ../backend, dockerfile: services/workflow-service/Dockerfile }
    environment:
      <<: *env
      POSTGRES_DB: workflow-service
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      REVIEW_ALLOW_LOCAL_LINKS: ${REVIEW_ALLOW_LOCAL_LINKS:-0}
    volumes: [ "uploads:/data/uploads" ]

  decision:
    <<: *django
    build: { context: ../backend, dockerfile: services/decision-service/Dockerfile }
    environment: { <<: *env, POSTGRES_DB: decision-service }

  integration:
    <<: *django
    build: { context: ../backend, dockerfile: services/integration-service/Dockerfile }
    environment:
      <<: *env
      POSTGRES_DB: integration-service
      SMS_MODE: ${SMS_MODE:-sandbox}                # sandbox (nothing is sent) | notifylk
      NOTIFYLK_USER_ID: ${NOTIFYLK_USER_ID:-}
      NOTIFYLK_API_KEY: ${NOTIFYLK_API_KEY:-}
      NOTIFYLK_SENDER_ID: ${NOTIFYLK_SENDER_ID:-}
      INTEGRATION_MODE: ${INTEGRATION_MODE:-mock}   # mock | live (live needs <NAME>_BASE_URL / <NAME>_API_KEY, see docs)

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:8025:8025"]   # the inbox web page, reachable only from this computer

  frontend:
    restart: unless-stopped
    build: { context: ../frontend, dockerfile: docker/Dockerfile }

  gateway:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/protected_params:/etc/nginx/protected_params:ro
    depends_on: [identity, workflow, decision, integration, frontend]

volumes: { pgdata: {}, uploads: {} }
