# API gateway. Every /api call except login and the customer review link is verified by the identity service
# (auth_request). Verified identity is injected as X-User-* headers; any client-supplied values are overwritten.
limit_req_zone $binary_remote_addr zone=login:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=public:10m rate=30r/m;

server {
  listen 80;
  server_tokens off;
  # Docker can assign new IPs when services are recreated. Resolve service names at
  # request time instead of retaining the addresses from the gateway's startup.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $identity_backend identity:8004;
  set $workflow_backend workflow:8001;
  set $decision_backend decision:8002;
  set $integration_backend integration:8003;
  set $frontend_backend frontend:80;
  client_max_body_size 12m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # --- identity check used by auth_request ---
  location = /_auth {
    internal;
    proxy_pass http://$identity_backend/api/v1/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
  }

  # --- no login required ---
  location = /api/v1/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://$identity_backend;
    include /etc/nginx/proxy_params;
    proxy_set_header X-User-Id ""; proxy_set_header X-User-Role ""; proxy_set_header X-Tenant-Id ""; proxy_set_header X-User-Branch ""; proxy_set_header X-User-Zone "";
  }
  location /api/v1/public/ {
    limit_req zone=public burst=20 nodelay;
    proxy_pass http://$workflow_backend;
    include /etc/nginx/proxy_params;
    proxy_set_header X-User-Id ""; proxy_set_header X-User-Role ""; proxy_set_header X-Tenant-Id ""; proxy_set_header X-User-Branch ""; proxy_set_header X-User-Zone "";
  }

  # --- authenticated APIs ---
  location /api/v1/auth/          { include /etc/nginx/protected_params; proxy_pass http://$identity_backend; }
  location /api/v1/applications   { include /etc/nginx/protected_params; proxy_pass http://$workflow_backend; }
  location /api/v1/files/         { include /etc/nginx/protected_params; proxy_pass http://$workflow_backend; }
  location /api/v1/decisions/     { include /etc/nginx/protected_params; proxy_pass http://$decision_backend; }
  # Only the read-only mode endpoint of the integration service is reachable from browsers; adapters are called by workflow-service.
  location = /api/v1/integrations/mode { include /etc/nginx/protected_params; proxy_pass http://$integration_backend; }

  location /api/ { return 404; }
  location / { proxy_pass http://$frontend_backend; include /etc/nginx/proxy_params; }
}
